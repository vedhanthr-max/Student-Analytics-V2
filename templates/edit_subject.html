{% extends 'base.html' %}

{% block title %}Edit Subject{% endblock %}
{% block extra_head %}




{% endblock %}
{% block content %}
<div class="card form-card">
<div class="card-header"><h2>Edit Subject</h2></div>
<div class="card-body">

    <form class="form-grid" action="/update_subject/{{ subject['subject_id'] }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <input type="text" name="subject_code" value="{{ subject['subject_code'] }}" required>

        <input type="text" name="subject_name" value="{{ subject['subject_name'] }}" required>

        <input type="number" name="semester" value="{{ subject['semester'] }}" required>

        <input type="number" name="credits" value="{{ subject['credits'] }}" required>

        <button>

            Update Subject

        </button>

    </form>

    <div class="form-actions"><a class="btn btn-ghost" href="/subjects">Cancel</a></div>
</div>
</div>
{% endblock %}
