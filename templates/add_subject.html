{% extends 'base.html' %}

{% block title %}Add Subject{% endblock %}
{% block extra_head %}



{% endblock %}
{% block content %}
<div class="card form-card">
    <div class="card-header"><h1>Add Subject</h1></div>
    <div class="card-body">

        <form action="{{ url_for('save_subject') }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-grid">
        <div class="field"><label for="subject_code">Subject Code</label>
            <input id="subject_code" type="text" name="subject_code" placeholder="Subject Code" required>
        </div>
        <div class="field"><label for="subject_name">Subject Name</label>
            <input id="subject_name" type="text" name="subject_name" placeholder="Subject Name" required>
        </div>
        <div class="field"><label for="semester">Semester</label>
            <input id="semester" type="number" name="semester" min="1" max="8" placeholder="Semester" required>
        </div>
        <div class="field"><label for="credits">Credits</label>
            <input id="credits" type="number" name="credits" min="1" placeholder="Credits" required>
        </div>
        </div>
            <div class="form-actions"><a class="btn btn-ghost" href="/subjects">Cancel</a><button type="submit">Save Subject</button></div>
        </form>
    </div>
    </div>
{% endblock %}
