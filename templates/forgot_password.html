<!DOCTYPE html>
<html>

<head>

    <title>Forgot Password</title>

</head>

<body>

<h2>Change Password</h2>

<form action="/change_password" method="POST">

<input type="text"
name="username"
placeholder="Username"
required>

<br><br>

<input type="password"
name="old_password"
placeholder="Old Password"
required>

<br><br>

<input type="password"
name="new_password"
placeholder="New Password"
required>

<br><br>

<input type="password"
name="confirm_password"
placeholder="Confirm New Password"
required>

<br><br>

<button type="submit">

Change Password

</button>

</form>

<br>

<a href="/">Back to Login</a>

</body>

</html>
