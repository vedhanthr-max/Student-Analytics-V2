{% extends 'base.html' %}

{% block title %}Add Semester Result{% endblock %}
{% block extra_head %}{% endblock %}
{% block content %}
<div class="card form-card">
    <div class="card-header"><h2>Add Semester Result</h2></div>
    <div class="card-body">

        <form action="/save_result" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-grid">
        <div class="field"><label for="register_no">Student</label>
            <select id="register_no" name="register_no" required>

                <option value="">Select Student</option>

                {% for student in students %}

                <option value="{{ student['register_no'] }}">

                    {{ student['register_no'] }} - {{ student['name'] }}

                </option>

                {% endfor %}

            </select>
        </div>
        <div class="field"><label for="semester">Semester</label>

            <select id="semester" name="semester" required>

                <option value="">Select Semester</option>

                <option value="1">Semester 1</option>
                <option value="2">Semester 2</option>
                <option value="3">Semester 3</option>
                <option value="4">Semester 4</option>
                <option value="5">Semester 5</option>
                <option value="6">Semester 6</option>
                <option value="7">Semester 7</option>
                <option value="8">Semester 8</option>

            </select>
        </div>
        <div class="field"><label for="subject_code">Subject</label>
            <select id="subject_code" name="subject_code" required>

                <option value="">Select Subject</option>

                {% for subject in subjects %}

                <option value="{{ subject['subject_code'] }}">

                    {{ subject['subject_code'] }} - {{ subject['subject_name'] }}

                </option>

                {% endfor %}

            </select>
        </div>
        <div class="field"><label for="internal_mark">Internal Mark</label><input id="internal_mark" type="number" step="0.1" name="internal_mark" placeholder="Internal Mark" required></div>
        <div class="field"><label for="external_mark">External Mark</label><input id="external_mark" type="number" step="0.1" name="external_mark" placeholder="External Mark" required></div>
        </div>
            <div class="form-actions"><a class="btn btn-ghost" href="/results">Cancel</a><button type="submit">Save Result</button></div>

        </form>
    </div>
    </div>
{% endblock %}
