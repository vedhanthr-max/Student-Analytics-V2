{% extends 'base.html' %}

{% block title %}Add Student{% endblock %}
{% block extra_head %}






{% endblock %}
{% block content %}
<div class="card form-card">
<div class="card-header"><h2>Add Student</h2><p class="topbar-subtitle">Create a complete student profile.</p></div>
<div class="card-body">

<form action="{{ url_for('save_student') }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-grid">
<div class="field"><label for="register_no">Register Number</label>
<input
type="text"
name="register_no"
id="register_no"
placeholder="Register Number"
required>
 </div>
<div class="field"><label for="name">Student Name</label>
<input
type="text"
name="name"
id="name"
placeholder="Student Name"
required>
 </div>
<div class="field"><label for="department">Department</label>
<input
type="text"
name="department"
id="department"
placeholder="Department"
required>
 </div>
<div class="field"><label for="year">Year</label>
<input
type="text"
name="year"
id="year"
placeholder="Year"
required>
 </div>
<div class="field"><label for="study_hours">Study Hours</label>
<input
type="number"
step="0.1"
name="study_hours"
id="study_hours"
placeholder="Study Hours"
required>
 </div>
<div class="field"><label for="attendance">Attendance</label>
<input
type="number"
step="0.1"
name="attendance"
id="attendance"
placeholder="Attendance"
required>
 </div>
<div class="field"><label for="assignment">Assignment Marks</label>
<input
type="number"
step="0.1"
name="assignment"
id="assignment"
placeholder="Assignment Marks"
required>
 </div>
<div class="field"><label for="internal">Internal Marks</label>
<input
type="number"
step="0.1"
name="internal"
id="internal"
placeholder="Internal Marks"
required>
 </div>
<div class="field"><label for="student_phone">Student Phone</label>
<input
type="tel"
name="student_phone"
id="student_phone"
placeholder="Student Phone"
required>
 </div>
<div class="field"><label for="parent_phone">Parent Phone</label>
<input
type="tel"
name="parent_phone"
id="parent_phone"
placeholder="Parent Phone"
required>
 </div>
<div class="field field-wide"><label for="email">Email</label>
<input
type="email"
name="email"
id="email"
placeholder="Email"
required>
</div>
</div>
<div class="form-actions"><button class="btn btn-ghost" type="button" onclick="history.back()">Cancel</button><button type="submit">Save Student</button></div>
</form>
</div>
</div>
{% endblock %}
