<!DOCTYPE html>
<html>
<head>

<title>Add Student</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

<h2>Add Student</h2>

<form action="{{ url_for('save_student') }}" method="POST">

<input
type="text"
name="register_no"
placeholder="Register Number"
required>

<input
type="text"
name="name"
placeholder="Student Name"
required>

<input
type="text"
name="department"
placeholder="Department"
required>

<input
type="text"
name="year"
placeholder="Year"
required>

<input
type="number"
step="0.1"
name="study_hours"
placeholder="Study Hours"
required>

<input
type="number"
step="0.1"
name="attendance"
placeholder="Attendance"
required>

<input
type="number"
step="0.1"
name="assignment"
placeholder="Assignment Marks"
required>

<input
type="number"
step="0.1"
name="internal"
placeholder="Internal Marks"
required>

<input
type="tel"
name="student_phone"
placeholder="Student Phone"
required>

<input
type="tel"
name="parent_phone"
placeholder="Parent Phone"
required>

<input
type="email"
name="email"
placeholder="Email"
required>

<button type="submit">

Save Student

</button>

</form>

</div>

</body>
</html>
