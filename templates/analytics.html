<!DOCTYPE html>
<html>

<head>

    <title>Analytics Dashboard</title>

    <style>
        body {

            font-family: Arial;

            background: #f5f5f5;

            padding: 40px;

        }

        .card {

            width: 250px;

            padding: 20px;

            margin: 15px;

            display: inline-block;

            background: white;

            border-radius: 10px;

            box-shadow: 0px 0px 10px gray;

            text-align: center;

        }

        h1 {

            text-align: center;

        }
    </style>

</head>

<body>

    <h1>📊 Analytics Dashboard</h1>

    <div class="card">
        <h2>Total Students</h2>
        <h1>{{ total_students }}</h1>
    </div>

    <div class="card">
        <h2>🟢 Excellent</h2>
        <h1>{{ excellent }}</h1>
    </div>

    <div class="card">
        <h2>🟠 Average</h2>
        <h1>{{ average }}</h1>
    </div>

    <div class="card">
        <h2>🔴 Need Improvement</h2>
        <h1>{{ weak }}</h1>
    </div>

    <div class="card">
        <h2>⚪ Not Predicted</h2>
        <h1>{{ not_predicted }}</h1>
    </div>

    <br><br>

    {% if session.get("role") == "teacher" %}

    <a href="/teacher">

        <button>

            ⬅ Back to Dashboard

        </button>

    </a>

    {% else %}

    <a href="/admin">

        <button>

            ⬅ Back to Dashboard

        </button>

    </a>

    {% endif %}

</body>

</html>
