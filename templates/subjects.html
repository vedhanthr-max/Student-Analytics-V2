<!DOCTYPE html>
<html>

<head>

<title>Subjects</title>

</head>

<body>

<h2>Subjects</h2>

<a href="/add_subject">

<button>

Add Subject

</button>

</a>

<br><br>

<table border="1">

<tr>

<th>ID</th>
<th>Code</th>
<th>Name</th>
<th>Semester</th>
<th>Credits</th>
<th>Actions</th>
</tr>

{% for s in subjects %}

<tr>

<td>{{ s["subject_id"] }}</td>

<td>{{ s["subject_code"] }}</td>

<td>{{ s["subject_name"] }}</td>

<td>{{ s["semester"] }}</td>

<td>{{ s["credits"] }}</td>
<td>

<a href="/edit_subject/{{ s['subject_id'] }}">

<button>

✏ Edit

</button>

</a>

<a href="/delete_subject/{{ s['subject_id'] }}"
onclick="return confirm('Delete this Subject?')">

<button>

🗑 Delete

</button>

</a>

</td>
</tr>

{% endfor %}

</table>

</body>

</html>
