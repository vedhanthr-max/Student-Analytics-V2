{% extends 'base.html' %}

{% block title %}Edit Result{% endblock %}
{% block extra_head %}


{% endblock %}
{% block content %}
<div class="card form-card">
<div class="card-header"><h2>Edit Semester Result</h2></div>
<div class="card-body">

    <form class="form-grid" action="/update_result/{{ result['result_id'] }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        Register No<br>
        <input type="text" name="register_no" value="{{ result['register_no'] }}"><br><br>

        Semester<br>
        <input type="number" name="semester" value="{{ result['semester'] }}"><br><br>

        Subject Code<br>
        <input type="text" name="subject_code" value="{{ result['subject_code'] }}"><br><br>

        Subject Name<br>
        <input type="text" name="subject_name" value="{{ result['subject_name'] }}"><br><br>

        Internal Mark<br>
        <input type="number" step="0.1" name="internal_mark" value="{{ result['internal_mark'] }}"><br><br>

        External Mark<br>
        <input type="number" step="0.1" name="external_mark" value="{{ result['external_mark'] }}"><br><br>

        <button type="submit">

            Update Result

        </button>

    </form>

    <div class="form-actions"><a class="btn btn-ghost" href="/results">Cancel</a></div>
</div>
</div>
{% endblock %}
